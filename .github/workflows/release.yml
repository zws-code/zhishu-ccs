name: Release to Tencent COS

on:
  push:
    # Dedicated validation ref: branch pushes compile only; uploads still require a tag.
    branches:
      - 'codex/cos-validation'
    tags:
      - 'v*'
  # 手动触发即干跑：完整编译、签名、公证，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 演练与正式发布分别排队；不取消正在执行的发布。
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VITE_PLATFORM_API_URL: ${{ vars.ZHISHU_PLATFORM_API_URL }}
  VITE_PLATFORM_WEB_URL: ${{ vars.ZHISHU_PLATFORM_WEB_URL }}
  ZHISHU_PLATFORM_ALLOW_INSECURE_HTTP: ${{ vars.ZHISHU_PLATFORM_ALLOW_INSECURE_HTTP }}
  ZHISHU_UPDATE_URL: ${{ vars.ZHISHU_UPDATE_URL }}
  ZHISHU_UPDATE_PUBLIC_KEY: ${{ vars.ZHISHU_UPDATE_PUBLIC_KEY }}
  COS_BUCKET: ${{ vars.COS_BUCKET }}
  COS_REGION: ${{ vars.COS_REGION }}
  COS_UPLOAD_ACCELERATE: ${{ vars.COS_UPLOAD_ACCELERATE || 'false' }}
  COS_PREFIX: ${{ vars.COS_PREFIX || 'ccs/stable' }}
  COS_PUBLIC_BASE_URL: ${{ vars.COS_PUBLIC_BASE_URL }}
  MACOS_SIGNING_MODE: ${{ vars.ZHISHU_MACOS_SIGNING_MODE || 'developer-id' }}

jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。漏写的话
  # 升级到这一版的用户什么也看不到；结构写坏的话弹窗渲染出错，整个应用落进错误页。
  # 放在最前面查，不白跑编译。推 tag 和 push main 同时发生，不能指望 CI 先跑完单测，
  # 所以这里自己跑一遍检查所有随包摘要的那份单测。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    if: github.repository == 'zws-code/zhishu-ccs'
    outputs:
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 推 tag 时先快速检查摘要；后续配置预检也会核对源码版本与摘要
      - name: Require this version's summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::Missing $file. Write the in-app summary for $TAG (see src/whats-new/README.md); use \"items\": [] to skip the popup."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate release configuration and version
        id: config
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TAG="$(node -p "'v' + require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag differs from the committed application version"; exit 1
          fi
          node scripts/zhishu/cos-release.mjs check "$TAG"
          test -n "$SIGNING_KEY" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          case "$MACOS_SIGNING_MODE" in
            developer-id)
              for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                test -n "${!variable}" || { echo "::error::Missing $variable for Developer ID signing"; exit 1; }
              done ;;
            adhoc) echo "::warning::Ad-hoc macOS build: no Apple notarization; first installation may be blocked by Gatekeeper" ;;
            *) echo "::error::ZHISHU_MACOS_SIGNING_MODE must be developer-id or adhoc"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Test release scripts
        run: pnpm test:release

      - name: Test COS publisher
        run: pnpm test:release-cos

      - name: TypeScript check
        run: pnpm typecheck

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  release:
    needs: whats-new-check
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Zhishu production configuration
        run: node scripts/zhishu/prepare-release.mjs

      - name: Prepare Tauri signing key
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows 仅发布带更新签名的 NSIS EXE 安装包。
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --config src-tauri/tauri.release.local.conf.json --target aarch64-pc-windows-msvc --bundles nsis
          } else {
            pnpm tauri build --config src-tauri/tauri.release.local.conf.json --bundles nsis
          }

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # 正式发布与手动演练均使用已提交的应用版本
          $VERSION = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 只收集 NSIS 安装器，不能误取裸程序 EXE 或旧构建残留。
          $installers = @(Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -File -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows NSIS installer, found $($installers.Count) ($env:WINDOWS_RELEASE_ARCH)"
          }
          $installer = $installers[0]
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath -PathType Leaf)) {
            throw "Signature not found for $($installer.Name)"
          }
          $dest = "Zhishu-Ccs-$VERSION-Windows$assetSuffix.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path release-assets $dest)
          Copy-Item -LiteralPath $sigPath -Destination (Join-Path release-assets "$dest.sig")
          Write-Host "Signed installer copied: $dest"

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

  # macOS 两个架构分两台机器同时编译（以前在一台机器上串行），再由 macos-release 合并签名。
  # 编译不需要任何 secret；挂 release environment 只是为了和其它平台在开头一起批准一次。
  macos-binary:
    name: Build macOS binary (${{ matrix.target }})
    needs: whats-new-check
    runs-on: macos-14
    environment: release
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Zhishu production configuration
        run: node scripts/zhishu/prepare-release.mjs

      # 编译只做一次：编译失败是确定性的，重试没有意义。签名和公证依赖 Apple 的服务，
      # 在 macos-release 里单独重试，不会再重编。
      - name: Build Tauri App (${{ matrix.target }})
        timeout-minutes: 60
        run: pnpm tauri build --config src-tauri/tauri.release.local.conf.json --target ${{ matrix.target }} --no-bundle

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: macos-binary-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/zhishu-ccs
          if-no-files-found: error
          retention-days: 1

  # 合并成 universal 二进制后打包、签名、公证。不挂 environment：它依赖的 macos-binary
  # 已经过了 release 的批准，这里再挂会在半路要求第二次批准。secret 都是仓库级的。
  macos-release:
    name: Bundle macOS release
    runs-on: macos-14
    needs: macos-binary
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Zhishu production configuration
        run: node scripts/zhishu/prepare-release.mjs

      - name: Prepare Tauri signing key
        uses: ./.github/actions/prepare-tauri-signing-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Select ad-hoc signing for internal distribution
        if: env.MACOS_SIGNING_MODE == 'adhoc'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        if: env.MACOS_SIGNING_MODE == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: macos-binary-*
          path: macos-binaries

      # tauri bundle 只读这个 universal 二进制（和 tauri build --target universal-apple-darwin
      # 的 lipo 结果相同），不需要各架构的 target 目录。
      - name: Merge universal binary
        shell: bash
        run: |
          set -euo pipefail
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/zhishu-ccs" \
            macos-binaries/macos-binary-aarch64-apple-darwin/zhishu-ccs \
            macos-binaries/macos-binary-x86_64-apple-darwin/zhishu-ccs
          chmod +x "$out/zhishu-ccs"
          lipo -info "$out/zhishu-ccs"

      # 只打 .app（连同 updater 的 .app.tar.gz 和 .sig）：发布用的 DMG 在下面由 create-dmg 制作，
      # Tauri 自己的 DMG 从来不上传。失败只重试这一步，不会重编。
      - name: Bundle, sign and notarize (macOS)
        shell: bash
        timeout-minutes: 45
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ env.MACOS_SIGNING_MODE == 'developer-id' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.MACOS_SIGNING_MODE == 'developer-id' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MACOS_SIGNING_MODE == 'developer-id' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          # Tauri treats even empty APPLE_* variables as notarization credentials.
          # Ad-hoc builds must remove them from the child environment entirely.
          if [ "$MACOS_SIGNING_MODE" = adhoc ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          fi
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS bundle/notarization attempt ${attempt}/${max_attempts} ==="
            bundle_log="$RUNNER_TEMP/tauri-bundle-macos-${attempt}.log"
            if pnpm tauri bundle --config src-tauri/tauri.release.local.conf.json --target universal-apple-darwin --bundles app 2>&1 | tee "$bundle_log"; then
              echo "✅ macOS bundle/notarization succeeded"
              exit 0
            fi

            # Apple 拒绝凭据或账号协议（401/403，例如 "A required agreement is missing or has expired"）
            # 只能人工处理，重试没有意义。
            if grep -qE 'HTTP status code: 40[13]' "$bundle_log"; then
              echo "❌ Apple rejected the notarization request (HTTP 401/403); retrying cannot fix this." >&2
              echo "   If it mentions an agreement, the Account Holder must accept it at developer.apple.com, then re-run this job." >&2
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS bundle/notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS bundle/notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Prepare macOS Assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          # 正式发布与手动演练均使用已提交的应用版本
          VERSION="$(node -p "'v' + require('./package.json').version")"

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$TAR_GZ" ]; then
            echo "❌ No macOS .tar.gz updater artifact found" >&2
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # Staple notarization ticket to .app (Tauri already notarized it)
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            xcrun stapler staple "$APP_PATH"
            echo "✅ .app stapled"
          fi

          # 1) Collect .tar.gz (updater artifact)
          NEW_TAR_GZ="Zhishu-Ccs-${VERSION}-macOS.tar.gz"
          cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
          if [ ! -f "$TAR_GZ.sig" ]; then
            echo "❌ Updater signature not found: $TAR_GZ.sig" >&2
            exit 1
          fi
          cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig"
          echo "macOS updater artifact copied: $NEW_TAR_GZ"

          # 2) Collect .app as zip
          NEW_ZIP="Zhishu-Ccs-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY is missing before DMG creation" >&2
            exit 1
          fi

          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="Zhishu-Ccs-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          APP_BUNDLE_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/$APP_BUNDLE_NAME"

          create-dmg \
            --volname "${APP_BUNDLE_NAME%.app}" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "$APP_BUNDLE_NAME" 180 220 \
            --hide-extension "$APP_BUNDLE_NAME" \
            --app-drop-link 480 220 \
            --codesign "$APPLE_SIGNING_IDENTITY" \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Notarize macOS DMG
        if: env.MACOS_SIGNING_MODE == 'developer-id'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        shell: bash
        run: |
          set -euo pipefail

          # Verify .app (from Tauri bundle)
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found for verification" >&2
            exit 1
          fi
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
            spctl -a -t exec -vv "$APP_PATH"
            xcrun stapler validate "$APP_PATH"
            echo "✅ .app notarization verified"
          fi

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            if [ "$MACOS_SIGNING_MODE" = developer-id ]; then
              spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
              xcrun stapler validate "$DMG_PATH"
              echo "✅ .dmg notarization verified"
            fi
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-macOS
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Validate artifacts and publish to COS
    runs-on: ubuntu-22.04
    needs: [whats-new-check, release, macos-release]
    # 手动运行和专用分支推送只校验并保存产物；仅 push tag 可上传 COS。
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'cos-production' || 'release-validation' }}
    concurrency:
      group: cos-stable-publication
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout release manifest tools
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      # 签名就在刚下载的产物里：latest.json 随安装包一起上传。缺平台时在建 release 之前就失败，
      # 不会留下一个缺 latest.json 的半成品 release。
      - name: Generate latest.json
        env:
          TAG: ${{ needs.whats-new-check.outputs.tag }}
        run: |
          set -euo pipefail
          export RELEASE_PUB_DATE="$(git show -s --format=%cI HEAD)"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { collectUpdaterPlatforms, targets, versionNumber } from './scripts/zhishu/release-artifacts.mjs';
          const version = versionNumber(process.env.TAG);
          const platforms = collectUpdaterPlatforms('release-assets', Object.keys(targets), version,
            { updatePublicKey: process.env.ZHISHU_UPDATE_PUBLIC_KEY },
            { downloadBaseUrl: process.env.COS_PUBLIC_BASE_URL.replace(/\/+$/, '') });
          writeFileSync('release-assets/latest.json', JSON.stringify({
            version,
            notes: `Release ${process.env.TAG}`,
            pub_date: process.env.RELEASE_PUB_DATE,
            platforms,
          }, null, 2) + '\n');
          NODE

      - name: Generate platform download manifest
        env:
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.whats-new-check.outputs.tag }}
        run: node scripts/generate-download-manifest.mjs release-assets "$RELEASE_TAG" "$COS_PUBLIC_BASE_URL" release-assets/client-release.json

      - name: Verify signatures and prepare COS payload
        env:
          RELEASE_TAG: ${{ needs.whats-new-check.outputs.tag }}
        run: node scripts/zhishu/cos-release.mjs prepare release-assets "$RELEASE_TAG" cos-payload

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate publication without uploading
        run: python scripts/zhishu/publish-cos.py cos-payload --dry-run

      - name: Save verified payload for retries
        uses: actions/upload-artifact@v7
        with:
          name: cos-payload-${{ needs.whats-new-check.outputs.tag }}
          path: cos-payload/*
          retention-days: 30
          if-no-files-found: error

      - name: Install COS SDK
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python -m pip install -r scripts/zhishu/cos-requirements.txt

      - name: Check actual COS SDK upload contract
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python -B -m unittest discover -s scripts -p 'test_publish_cos.py' -k CosSdkContractTests

      - name: Publish immutable artifacts and stable manifests
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
        run: python scripts/zhishu/publish-cos.py cos-payload

      # 上游兼容入口保留；智枢仓库由后续独立作业创建 Release。
      - name: Upload Release Assets
        if: github.repository == 'farion1231/cc-switch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          prerelease: true
          body: |
            ## CC Switch ${{ github.ref_name }}

            🌐 **Only Official Website / 唯一官方网站 / 唯一の公式サイト**: [ccswitch.io](https://ccswitch.io)

            Claude Code 供应商切换工具

            ### 下载

            - **macOS**: `Zhishu-Ccs-${{ github.ref_name }}-macOS.dmg`（推荐）或 `Zhishu-Ccs-${{ github.ref_name }}-macOS.zip`（解压即用）
            - **Windows (x86_64)**: `Zhishu-Ccs-${{ github.ref_name }}-Windows.exe`（安装版）
            - **Windows (ARM64)**: `Zhishu-Ccs-${{ github.ref_name }}-Windows-arm64.exe`（安装版）

            > `.tar.gz` 为 Tauri updater 自动更新专用，无需手动下载。

            ---
            macOS 版本已通过 Apple 代码签名和公证，可直接安装使用。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-github-release:
    name: Publish GitHub Release after COS
    needs: [whats-new-check, publish-release]
    if: github.repository == 'zws-code/zhishu-ccs' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified COS payload
        uses: actions/download-artifact@v8
        with:
          name: cos-payload-${{ needs.whats-new-check.outputs.tag }}
          path: cos-payload

      - name: Publish signed installers on GitHub
        id: github-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.whats-new-check.outputs.tag }}
          name: 智枢 CCS ${{ needs.whats-new-check.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: 'true'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: cos-payload/*
          body: |
            智枢 CCS ${{ needs.whats-new-check.outputs.tag }}

            ### 下载安装包

            在下方 Assets 中选择对应系统的文件：
            - macOS（Intel / Apple Silicon 通用）：`.dmg`，也可使用 `.zip`。
            - Windows x64：`-Windows.exe`；Windows ARM64：`-Windows-arm64.exe`。
            - Linux 暂停打包。
            - `.tar.gz` 和 `.sig` 用于客户端更新与签名校验。

            [COS 下载清单](${{ env.COS_PUBLIC_BASE_URL }}/${{ needs.whats-new-check.outputs.tag }}/client-release.json)

            客户端自动更新继续使用 COS 更新源；GitHub 提供相同发布文件的下载入口。

            ${{ env.MACOS_SIGNING_MODE == 'developer-id' && 'macOS 安装包已通过 Developer ID 签名与 Apple 公证。' || 'macOS 安装包使用 ad-hoc 签名，未经过 Apple 公证，首次安装可能被系统拦截。' }}
            Windows 安装包的 Tauri 更新签名不代表 Windows 系统代码签名。

      - name: Show GitHub Release download link
        env:
          RELEASE_URL: ${{ steps.github-release.outputs.url }}
        run: echo "[下载安装包 / GitHub Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
